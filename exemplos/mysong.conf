# O arquivo de ajustes do mysong.
#
# Mora em $XDG_CONFIG_HOME/mysong/mysong.conf, e na falta da variavel em
# ~/.config/mysong/mysong.conf. O programa LE este arquivo e NUNCA o escreve:
# o que o senhor puser aqui, estes commentarios inclusive, fica.
#
# Arquivo ausente nao e erro: valem os padroes, e nada se diz. Chave que o
# programa nao conhece, e valor que nao presta, tambem nao derrubam nada:
# cae-se no padrao e a queixa apparece no `mysong --sonda`, que diz tambem de
# ONDE veio cada ajuste que esta valendo.
#
# A precedencia, do mais forte para o mais fraco:
#   1. argumento da linha de commando   (mysong --acervo=/caminho)
#   2. variavel de ambiente             (MYSONG_ACERVO)
#   3. este arquivo
#   4. o padrao da Casa
#
# Copiado tal e qual, este arquivo NAO muda cousa alguma: as tres linhas
# activas trazem os proprios padroes da Casa. Mude o valor, e nao a chave.
#
# O formato e uma linha por ajuste, `chave = valor`. Os brancos das pontas
# aparam-se, e os do meio ficam, donde caminho com espaco vale inteiro. O `#`
# abre commentario ATE O FIM DA LINHA, em qualquer ponto: caminho que traga
# `#` no nome nao se pode escrever aqui, e isso e limite declarado.

# O ACERVO: a pasta que a varredura percorre, e onde as baixas ficam. Ha de
# ser directorio que exista, senao cae no padrao com queixa. Descommente e
# ponha o seu caminho. O `~` NAO se expande aqui: escreva o caminho inteiro.
# Padrao: ~/Música
# acervo = /home/bragaus/Musicas

# O VOLUME com que a obra abre, de 0 a 100.
# Padrao: 100
volume = 100

# A FONTE da busca da tecla `s`: youtube, youtube-music ou spotify.
# Padrao: youtube
fonte_da_busca = youtube

# QUANTAS BAIXAS correm ao mesmo tempo, de 1 a 8. Mais que duas disputam a
# mesma rede, e acabam todas mais tarde do que duas acabariam.
# Padrao: 2
baixas_simultaneas = 2

# OS SEXTANTES na capa do album: auto, sim ou nao.
#
# O chafa desenha a capa com blocos, meios-blocos e quadrantes. O SEXTANTE
# (o glypho de 2 por 3 sub-celullas) dobra os degraus por celulla, mas so
# presta se a fonte do seu terminal o tiver: sem elle sahe quadriculo vazio.
#
# `auto` pergunta ao fontconfig se alguma Nerd Font installada o tem. `sim`
# pede-o sempre, e ahi quem o desenha e a fonte de substituicao do terminal:
# compare com `fita_capa <imagem> 40x20` e `fita_capa <imagem> 40x20 sextantes`
# antes de decidir. `nao` nunca o pede.
# Padrao: auto
capa_sextantes = auto

# A LOUSA da capa nitida: auto, sim ou nao.
#
# Havendo o `ueberzugpp` installado e havendo X11, a capa do painel deixa de
# ser mosaico de caracteres e passa a ser a imagem de verdade, n'uma janella
# posta por cima do terminal. E o caminho que o yazi usa.
#
# `auto` ergue-a havendo DISPLAY e havendo o programa. `sim` salta a pergunta
# do DISPLAY, e somente ella: a variavel e palpite sobre haver X11 ao alcance,
# e voce pode saber melhor. `nao` fica nos symbolos do chafa.
# Padrao: auto
lousa = auto
